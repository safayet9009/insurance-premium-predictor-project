services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-premium-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: insurance-premium-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped